[pytest]
testpaths = tests

# A hung test must name itself. Without this a single stalled connection turns the whole run
# into a silent wait, which is exactly how CI used to burn its job limit with no output.
timeout = 120
timeout_method = thread

markers =
    db: needs a live PostgreSQL with pgvector. Skipped when none is configured, unless
        ORRERY_REQUIRE_DB=1 demands one (CI sets it on the job that provides the service).

norecursedirs =
    .git
    .venv
    build
    dist
    release
    ui/node_modules
    ui/dist
