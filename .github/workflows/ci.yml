name: CI

# Orrery serves its workspace to the user's own browser, so there is no native shell to sign,
# notarize, or package per platform. This one workflow replaced the three that did.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Correctness rules only (configured in pyproject.toml). The tree has never been run
      # through `ruff format`, so enforcing it belongs in its own change, not this one.
      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest tests/ -q

  ui:
    name: UI build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Build production bundle
        working-directory: ui
        run: npm run build
