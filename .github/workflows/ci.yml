name: CI

# Orrery serves its workspace to the user's own browser, so there is no native shell to sign,
# notarize, or package per platform. This one workflow replaced the three that did.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The full suite, including everything that touches real persistence. Service containers only
  # run on Linux runners, and the migrations need the `vector` extension, so this is the one job
  # that can honestly claim to cover the database-backed behavior.
  backend:
    name: Backend tests (ubuntu, PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # Same image as docker-compose.yml, so CI and a developer laptop agree on the extension set.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: orrery
          POSTGRES_PASSWORD: orrery_ci_password
          POSTGRES_DB: orrery
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orrery -d orrery"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # Throwaway CI credential for the service container above; real secrets live in the keychain.
      DATABASE_URL: postgresql+psycopg://orrery:orrery_ci_password@127.0.0.1:5432/orrery
      # This job spun up a database, so a `db` test that skips here is a failure, not a pass.
      ORRERY_REQUIRE_DB: "1"
      # Qt has no display on a runner; offscreen is what lets QtPdf rasterize anyway.
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # QtPdf renders PDF previews on every platform including Linux, but PySide6 needs system
      # graphics libraries the runner does not carry by default. Without these the renderer is
      # simply unavailable and its tests skip, so this is what keeps Linux preview coverage real.
      - name: Install Qt runtime libraries for the PDF renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq             libgl1 libegl1 libxkbcommon0 libdbus-1-3 libglib2.0-0             libfontconfig1 libfreetype6 libx11-6 libxext6 libxrender1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Correctness rules only (configured in pyproject.toml). The tree has never been run
      # through `ruff format`, so enforcing it belongs in its own change, not this one.
      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest tests/ -q --durations=10

  # Windows is the most-tested target and macOS is supported, but neither runner can host a
  # service container. They run everything that does not need a database; the `db` tests are
  # covered by the job above rather than silently dropped.
  crossplatform:
    name: Backend tests (${{ matrix.os }}, no database)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -q -m "not db" --durations=10

  ui:
    name: UI tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Run UI tests
        working-directory: ui
        run: npm test

      - name: Build production bundle
        working-directory: ui
        run: npm run build
